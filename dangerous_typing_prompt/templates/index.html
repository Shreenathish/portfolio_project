<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Detection</title>
</head>
<body>
    <h1>Typing Detection</h1>
    
    <form method="POST" action="/">
        <label for="text_input">Start typing here:</label><br>
        <input type="text" id="text_input" name="text_input" autofocus>
        <button type="submit">Submit</button>
    </form>

    <p>Status: {{ status }}</p>
    <p>Total keystrokes: {{ keystrokes }}</p>
</body>
</html>
